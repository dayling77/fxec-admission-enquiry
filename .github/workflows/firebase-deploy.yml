name: Deploy FXEC Admission Portal

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FXEC_ADMISSION_ENQUIRY }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project fxec-admission-enquiry --non-interactive

      - name: Deploy Hosting
        run: firebase deploy --only hosting --project fxec-admission-enquiry --non-interactive
